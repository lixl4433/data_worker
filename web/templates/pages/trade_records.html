{% extends "layout.html" %}
{% block title %}实盘记录 - 量化选股系统{% endblock %}
{% block head %}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-title">
        <span>📈 实盘交易记录</span>
        <span class="sub">AI 选股 TOP 10 → 记录买入价 → 3 天后结算 → 统计胜率</span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
        <button class="btn btn-success btn-sm" onclick="createTradeBatch()">📝 创建新批次（TOP 10）</button>
        <button class="btn btn-primary btn-sm" onclick="loadTradeStats()">📊 查看统计</button>
        <span id="tradeStatus" style="font-size:12px;color:var(--text-secondary);align-self:center;"></span>
    </div>
    <div id="tradeStatsArea" style="display:none; margin-bottom:12px;">
        <div style="display:flex; gap:16px; flex-wrap:wrap; padding:12px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:8px;">
            <div><span style="color:var(--text-secondary);font-size:12px;">总交易</span><br><strong style="font-size:20px;" id="tsTotal">0</strong></div>
            <div><span style="color:var(--text-secondary);font-size:12px;">胜</span><br><strong style="font-size:20px;color:var(--green);" id="tsWins">0</strong></div>
            <div><span style="color:var(--text-secondary);font-size:12px;">负</span><br><strong style="font-size:20px;color:var(--red);" id="tsLosses">0</strong></div>
            <div><span style="color:var(--text-secondary);font-size:12px;">胜率</span><br><strong style="font-size:20px;color:var(--orange);" id="tsWinRate">0%</strong></div>
            <div><span style="color:var(--text-secondary);font-size:12px;">平均收益</span><br><strong style="font-size:20px;" id="tsAvgRet">0%</strong></div>
            <div><span style="color:var(--text-secondary);font-size:12px;">批次</span><br><strong style="font-size:20px;" id="tsBatches">0</strong></div>
        </div>
    </div>
    <div id="tradeBatchesArea" style="display:none;">
        <div class="result-table-wrap">
            <table>
                <thead><tr><th>批次</th><th>买入日</th><th>卖出日</th><th>股票数</th><th>胜</th><th>负</th><th>胜率</th><th>均收益</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="tradeBatchTbody"></tbody>
            </table>
        </div>
    </div>
    <div id="tradeDetailArea" style="display:none; margin-top:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <strong id="tradeDetailTitle" style="font-size:14px;"></strong>
            <button class="btn btn-warning btn-sm" onclick="settleBatch()" id="btnSettle">💰 结算该批次</button>
        </div>
        <div class="result-table-wrap">
            <table>
                <thead><tr><th>#</th><th>代码</th><th>名称</th><th>评分</th><th>买入价</th><th>股数</th><th>卖出价</th><th>收益</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="tradeRecordTbody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/pages/trade_records.js"></script>
{% endblock %}
